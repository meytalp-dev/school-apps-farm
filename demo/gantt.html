      + '<label class="f">אחראי/ת<select class="in" id="aO">' + ow + '</select></label>'
      + '<label class="f">כיתות / קהל<select class="in" id="aG">' + tg + '</select></label>'
      + '<label class="f span2">מה להכין<textarea class="in" id="aP" style="min-height:70px"></textarea></label></div>';
    document.getElementById('aHost').innerHTML = DemoShell.modalHTML('mAdd', 'הוספת אירוע ללוח', body,
      '<button type="button" class="btn-sm ghost" onclick="DemoShell.closeModal(\'mAdd\')">ביטול</button><button type="button" class="btn-sm primary" onclick="saveAdd()">הוספה ללוח</button>');
  }
  document.getElementById('aT').value = ''; DemoShell.openModal('mAdd');
}
function saveAdd() {
  var t = document.getElementById('aT').value.trim(), d = document.getElementById('aD').value;
  if (!t) { DemoShell.toast('צריך כותרת לאירוע'); return; }
  if (!d || d < '2026-09-01' || d > '2027-06-20') { DemoShell.toast('התאריך צריך להיות בתוך שנת הלימודים'); return; }
  ev(d, t, document.getElementById('aK').value, document.getElementById('aG').value, +document.getElementById('aO').value, document.getElementById('aP').value.trim());
  DemoShell.closeModal('mAdd');
  var dd = D(d); if (state.m !== 'all' && +state.m !== dd.getMonth()) { state.m = 'all'; document.getElementById('selM').value = 'all'; }
  state.q = ''; document.getElementById('q').value = ''; render();
  var wrap = document.getElementById('wrap'), row = document.querySelector('tr[data-k="' + d + '"]');
  if (row) wrap.scrollTop = row.getBoundingClientRect().top - wrap.getBoundingClientRect().top + wrap.scrollTop - 120;
  DemoShell.toast('האירוע נוסף ללוח (בדמו)');
}

  document.getElementById('selM').value = 'all'; document.getElementById('selC').value = 'all'; document.getElementById('q').value = '';
  document.getElementById('moeBtn').classList.remove('on');
