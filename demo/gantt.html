<style>
  /* ─── סרגל סינון ─── */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .filters .in { padding: 8px 12px; font-size: 13.5px; }
  .qbox { position: relative; }
  .qbox svg { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--gray); pointer-events: none; }
  .qbox .in { padding-right: 32px; width: 190px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--gray); font-weight: 700; margin-top: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .legend i.hol { background: repeating-linear-gradient(135deg, rgba(240,6,120,.35) 0 2px, transparent 2px 5px); }
  .legend i.ring { background: #fff; box-shadow: inset 0 0 0 2px var(--navy); border-radius: 50%; }

  /* ─── גאנט שנתי ─── */
  .gantt { position: relative; --lw: 160px; font-size: 12px; user-select: none; }
  .g-head { display: flex; border-bottom: 1px solid var(--line); background: #fff; }
  .g-label { flex: 0 0 var(--lw); padding: 8px 6px 8px 8px; border-left: 1px solid var(--line); min-width: 0; }
  .g-track { flex: 1; position: relative; min-width: 0; overflow: hidden; }
  .g-months { display: flex; height: 34px; }
  .g-months div { display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--navy); border-left: 1px dashed rgba(6,30,79,.12); font-size: 12.5px; }
  .g-months div.cur { color: var(--fuchsia); }
  .g-hols { position: relative; height: 18px; }
  .g-hols span, .g-hol { position: absolute; top: 0; bottom: 0; }
  .g-hols span { font-size: 9px; font-weight: 800; color: var(--fuchsia); display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; background: rgba(240,6,120,.07); }
  .g-hol { background: repeating-linear-gradient(135deg, rgba(240,6,120,.07) 0 4px, transparent 4px 9px); pointer-events: none; }
  .g-body { position: relative; }
  .g-row { display: flex; border-bottom: 1px solid var(--line); position: relative; }
  .g-row:last-child { border-bottom: none; }
  .g-row:hover { background: rgba(18,199,199,.035); }
  .g-row .g-label { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .g-label b { font-size: 13px; font-weight: 800; color: var(--navy); }
  .g-label small { color: var(--gray); font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-label em { font-style: normal; font-size: 11px; color: var(--gray); }
  .g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fuchsia); z-index: 2; pointer-events: none; }
  .g-today-tag { position: absolute; top: 33px; transform: translateX(50%); background: var(--fuchsia); color: #fff; font-size: 9.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; z-index: 3; }
  .g-empty { padding: 26px; text-align: center; color: var(--gray); font-size: 13px; }

  .ev { position: absolute; height: 22px; display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; transition: transform var(--motion-fast) var(--motion-ease), opacity var(--motion-fast); }
  .ev:hover { transform: translateY(-1px); z-index: 4; }
  .ev i { display: block; height: 14px; border-radius: 999px; background: var(--c); flex: 0 0 auto; box-shadow: 0 2px 6px rgba(6,30,79,.14); }
  .ev span { font-size: 11.5px; font-weight: 700; color: var(--navy); overflow: hidden; text-overflow: ellipsis; }
  .ev.inside i { display: flex; align-items: center; height: 18px; padding: 0 8px; }
  .ev.inside i span { color: #fff; }
  .ev.inside.light i span { color: var(--navy); }
  .ev.st-done i { opacity: .5; }
  .ev.st-done span { color: var(--gray); }
  .ev.st-prep i { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--c); }
  .ev.dim { opacity: .16; pointer-events: none; }

  /* ─── תצוגת חודש ─── */
  .mv-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .mv-head h4 { font-size: 18px; font-weight: 900; letter-spacing: -.4px; }
  .mv-nav { display: flex; align-items: center; gap: 6px; }
  .mv-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mv-dow { font-size: 11px; font-weight: 800; color: var(--gray); text-align: center; padding: 4px 0; }
  .mv-day { min-height: 88px; border: 1px solid var(--line); border-radius: 12px; padding: 6px; background: #fff; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .mv-day.off { background: rgba(6,30,79,.03); }
  .mv-day.hol { background: rgba(240,6,120,.05); border-color: rgba(240,6,120,.16); }
  .mv-day.today { border-color: var(--fuchsia); box-shadow: 0 0 0 2px rgba(240,6,120,.16); }
  .mv-day.empty { border: none; background: transparent; }
  .mv-day b { font-size: 12px; font-weight: 800; color: var(--navy); display: flex; justify-content: space-between; align-items: baseline; }
  .mv-day b em { font-style: normal; color: var(--fuchsia); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mv-pill { font-size: 11px; font-weight: 700; color: #fff; background: var(--c); border-radius: 6px; padding: 2px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; transition: transform var(--motion-fast) var(--motion-ease); }
  .mv-pill:hover { transform: translateY(-1px); }
  .mv-pill.light { color: var(--navy); }
  .mv-pill.st-done { opacity: .5; }
  .mv-pill.dim { opacity: .16; pointer-events: none; }

  /* ─── צד: הקרובים + עומס ─── */
  .up { display: flex; flex-direction: column; gap: 8px; }
  .up a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; border: 1px solid var(--line); cursor: pointer; transition: transform var(--motion-fast) var(--motion-ease), box-shadow var(--motion-fast); text-decoration: none; color: inherit; }
  .up a:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(6,30,79,.08); }
  .dbox { flex: 0 0 44px; text-align: center; border-radius: 10px; background: rgba(6,30,79,.05); padding: 4px 0; }
  .dbox b { display: block; font-size: 16px; font-weight: 900; line-height: 1.1; }
  .dbox small { font-size: 10px; color: var(--gray); font-weight: 700; }
  .up .t { flex: 1; min-width: 0; }
  .up .t b { display: block; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up .t small { font-size: 11.5px; color: var(--gray); }
  .load { display: flex; flex-direction: column; gap: 8px; }
  .load div { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; }
  .load div span:first-child { flex: 0 0 96px; }
  .load .bar { flex: 1; }
  .load .n { flex: 0 0 22px; text-align: left; color: var(--gray); font-variant-numeric: tabular-nums; }

  /* ─── פירוט אירוע ─── */
  .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .meta div { background: var(--bg); border-radius: 12px; padding: 8px 10px; }
  .meta small { display: block; font-size: 11px; color: var(--gray); font-weight: 700; }
  .meta b { font-size: 13.5px; font-weight: 800; }
  .ck { list-style: none; display: flex; flex-direction: column; gap: 6px; margin: 8px 0 12px; }
  .ck label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; cursor: pointer; }
  .ck input { width: 17px; height: 17px; accent-color: var(--fuchsia); }
  .ck label.on { color: var(--gray); text-decoration: line-through; background: rgba(123,203,82,.08); }
  .gchk { display: flex; gap: 6px; flex-wrap: wrap; }
  .gchk label { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; border: 1.5px solid rgba(6,30,79,.14); font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .gchk input { accent-color: var(--fuchsia); }
  .sec-t { font-size: 12px; font-weight: 800; color: var(--gray); margin-top: 10px; }

  @media (max-width: 720px) {
    .gantt { --lw: 92px; }
    .g-label small, .g-label em { display: none; }
    .qbox .in { width: 100%; }
    .qbox { flex: 1 1 100%; }
    .mv-day { min-height: 66px; padding: 3px; border-radius: 8px; }
    .mv-pill { font-size: 9.5px; padding: 1px 4px; }
    .meta { grid-template-columns: 1fr 1fr; }
  }
  @media print {
    .filters, .demo-toolbar, aside, .legend { display: none !important; }
    .row.side { grid-template-columns: 1fr; }
    .ev, .mv-pill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

/* ─── עזרים ─── */
function pd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function dk(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function days(a, b) { return Math.round((b - a) / 864e5); }
function fmt(d) { return d.getDate() + '.' + (d.getMonth() + 1); }
function fmtRange(ev) { var s = pd(ev.start), e = pd(ev.end); return s.getTime() === e.getTime() ? fmt(s) + '.' + s.getFullYear() : fmt(s) + ' – ' + fmt(e) + '.' + e.getFullYear(); }
function role(id) { for (var i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i]; return ROLES[0]; }
function byId(id) { for (var i = 0; i < EVENTS.length; i++) if (EVENTS[i].id === id) return EVENTS[i]; return null; }
function esc(s) { return DemoShell.esc(s); }
function holName(key) { for (var i = 0; i < HOL.length; i++) if (key >= HOL[i][0] && key <= HOL[i][1]) return HOL[i][2]; return ''; }
function mk(a) { return { id: a[0], title: a[1], start: a[2], end: a[3] || a[2], type: a[4], role: a[5], grades: a[6] ? a[6].split(',') : [], status: a[7], check: a[8].map(function (s) { return { t: s.replace(/^\*/, ''), done: s.charAt(0) === '*' }; }), notes: a[9] || '' }; }

/* ─── מצב + זיכרון מקומי ─── */
var KEY = 'farm-demo-gantt';
var saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }
var OV = saved.ov || {}, CUSTOM = saved.custom || [];
var EVENTS = RAW.map(mk).concat(CUSTOM);
EVENTS.forEach(function (ev) { var o = OV[ev.id]; if (!o) return; if (o.status) ev.status = o.status; if (o.done) ev.check.forEach(function (c, i) { c.done = !!o.done[i]; }); });
function persist() { try { localStorage.setItem(KEY, JSON.stringify({ ov: OV, custom: CUSTOM })); } catch (e) {} }
function markOV(ev) { OV[ev.id] = { status: ev.status, done: ev.check.map(function (c) { return c.done; }) }; persist(); }
function resetDemo() { localStorage.removeItem(KEY); location.reload(); }

var F = { view: 'year', role: 'all', grade: 'all', q: '', month: 2 };
function roleOK(ev) { return F.role === 'all' || ev.role === F.role; }
function matches(ev) {
  var g = F.grade === 'all' || ev.grades.length === 0 || ev.grades.indexOf(F.grade) >= 0;
  var q = !F.q || ev.title.indexOf(F.q) >= 0;
  return g && q;
}
function visible() { return EVENTS.filter(function (ev) { return roleOK(ev) && matches(ev); }); }

/* ─── KPI ─── */
function renderKPIs() {
  var m0 = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1), m1 = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0);
  var inMonth = EVENTS.filter(function (ev) { return pd(ev.start) <= m1 && pd(ev.end) >= m0; }).length;
  var prep = EVENTS.filter(function (ev) { return ev.status === 'prep'; }).length;
  var mine = EVENTS.filter(function (ev) { return ev.role === 'mgmt'; }).length;
  var open = 0; EVENTS.forEach(function (ev) { if (ev.status !== 'done') ev.check.forEach(function (c) { if (!c.done) open++; }); });
  document.getElementById('kpis').innerHTML =
    '<div class="kpi" style="--c:var(--navy)"><b>' + EVENTS.length + '</b><span>אירועים בתשפ"ז</span></div>' +

    '<div class="kpi" style="--c:var(--fuchsia)"><b>' + mine + '</b><span>באחריות ההנהלה</span></div>' +
    '<div class="kpi" style="--c:var(--green)"><b>' + open + '</b><span>משימות הכנה פתוחות</span></div>';
}

/* ─── גאנט שנתי ─── */
function renderYear() {
  var host = document.getElementById('main');
  host.innerHTML = '<div class="gantt" id="gantt"></div>';
  var g = document.getElementById('gantt');
  var LW = window.innerWidth <= 720 ? 92 : 160;
  var Wt = Math.max(200, g.clientWidth - LW);
  function x(d) { return days(Y0, d) / TOTAL * Wt; }

  /* כותרת: חודשים + רצועת חופשות + "היום" */
  var h = '<div class="g-head"><div class="g-label"><em>תפקיד</em></div><div class="g-track"><div class="g-months">';
  MONTHS.forEach(function (m) {
    var dim = new Date(m[0], m[1], 0).getDate();
    var cur = (m[0] === TODAY.getFullYear() && m[1] === TODAY.getMonth() + 1) ? ' class="cur"' : '';
    h += '<div' + cur + ' style="flex:' + dim + ' 0 0">' + (Wt / 10 < 40 ? m[4] : m[2]) + '</div>';
  });
  h += '</div><div class="g-hols">';
  var stripes = '';
  HOL.forEach(function (hl) {
    var r = x(pd(hl[0])), w = x(pd(hl[1])) - r + Wt / TOTAL;
    h += '<span style="right:' + r + 'px;width:' + w + 'px" title="' + hl[2] + '">' + (w >= 22 ? hl[2] : '') + '</span>';
    stripes += '<div class="g-hol" style="right:' + (r + LW) + 'px;width:' + w + 'px"></div>';
  });
  var tx = x(TODAY) + Wt / TOTAL / 2;
  h += '</div><div class="g-today-tag" style="right:' + tx + 'px">היום · ' + fmt(TODAY) + '</div></div></div>';

  /* שורות לפי תפקיד */
  h += '<div class="g-body">' + stripes;
  var rows = ROLES.filter(function (r) { return F.role === 'all' || r.id === F.role; });
  rows.forEach(function (r) {
    var evs = EVENTS.filter(function (ev) { return ev.role === r.id; }).sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
    var ends = [], items = '';
    evs.forEach(function (ev) {
      var s = pd(ev.start), e = pd(ev.end);
      var right = x(s), w = Math.max(12, x(e) - x(s) + Wt / TOTAL);
      var lw = ev.title.length * 6.6 + 8;
      var inside = w >= lw + 18;
      /* אין מקום לתווית משמאל לפס? הופכים — התווית מימין לפס */
      var flip = !inside && right + w + 6 + lw > Wt && right - lw - 6 >= 0;
      var from = flip ? right - lw - 6 : right;
      var span = inside ? w : (flip ? lw + 6 + w : w + 6 + Math.min(lw, Math.max(0, Wt - right - w - 6)));
      var lane = 0; while (lane < ends.length && ends[lane] > from - 10) lane++;
      ends[lane] = from + span;
      var t = TYPES[ev.type];
      var cls = 'ev st-' + ev.status + (inside ? ' inside' : '') + (t.light ? ' light' : '') + (matches(ev) ? '' : ' dim');
      var label = esc(ev.title);
      var pill = '<i style="width:' + w + 'px">' + (inside ? '<span>' + label + '</span>' : '') + '</i>';
      items += '<div class="' + cls + '" style="--c:' + t.c + ';right:' + from + 'px;top:' + (6 + lane * 26) + 'px;max-width:' + (Wt - from) + 'px" title="' + label + ' · ' + fmtRange(ev) + '" onclick="openDetail(\'' + ev.id + '\')">'
        + (inside ? pill : (flip ? '<span>' + label + '</span>' + pill : pill + '<span>' + label + '</span>')) + '</div>';
    });
    var H = Math.max(1, ends.length) * 26 + 10;
    h += '<div class="g-row" style="height:' + H + 'px"><div class="g-label"><b>' + r.name + '</b><small>' + r.who + '</small><em>' + evs.length + ' אירועים</em></div><div class="g-track">' + items + '</div></div>';
  });
  h += '<div class="g-today" style="right:' + (tx + LW) + 'px"></div></div>';
  g.innerHTML = h;
}

/* ─── תצוגת חודש ─── */
function shiftMonth(d) { F.month = Math.min(MONTHS.length - 1, Math.max(0, F.month + d)); renderAll(); }
function renderMonth() {
  var m = MONTHS[F.month], y = m[0], mo = m[1] - 1;
  var first = new Date(y, mo, 1), dim = new Date(y, mo + 1, 0).getDate();
  var h = '<div class="mv-head"><h4>' + m[3] + ' ' + y + '</h4><div class="mv-nav">'
    + '<button type="button" class="btn-sm ghost" onclick="shiftMonth(-1)"' + (F.month === 0 ? ' disabled' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg> הקודם</button>'
    + '<button type="button" class="btn-sm" onclick="F.month=2;renderAll()">היום</button>'
    + '<button type="button" class="btn-sm ghost" onclick="shiftMonth(1)"' + (F.month === MONTHS.length - 1 ? ' disabled' : '') + '>הבא <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button></div></div>';
  h += '<div class="mv-grid">';
  ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'].forEach(function (d) { h += '<div class="mv-dow">' + d + '</div>'; });
  for (var i = 0; i < first.getDay(); i++) h += '<div class="mv-day empty"></div>';
  var pool = EVENTS.filter(roleOK);
  for (var d = 1; d <= dim; d++) {
    var dt = new Date(y, mo, d), key = dk(dt), hol = holName(key), dow = dt.getDay();
    var cls = 'mv-day' + (dow >= 5 ? ' off' : '') + (hol ? ' hol' : '') + (dt.getTime() === TODAY.getTime() ? ' today' : '');
    h += '<div class="' + cls + '"><b>' + d + (hol ? '<em>' + hol + '</em>' : (dt.getTime() === TODAY.getTime() ? '<em>היום</em>' : '')) + '</b>';
    pool.forEach(function (ev) {
      if (key < ev.start || key > ev.end) return;
      var t = TYPES[ev.type];
      h += '<div class="mv-pill st-' + ev.status + (t.light ? ' light' : '') + (matches(ev) ? '' : ' dim') + '" style="--c:' + t.c + '" title="' + esc(ev.title) + '" onclick="openDetail(\'' + ev.id + '\')">' + esc(ev.title) + '</div>';
    });
    h += '</div>';
  }
  document.getElementById('main').innerHTML = h + '</div>';
}

function renderAside() {

function monthIdx(d) { for (var i = 0; i < MONTHS.length; i++) if (MONTHS[i][0] === d.getFullYear() && MONTHS[i][1] === d.getMonth() + 1) return i; return 0; }

  document.getElementById('ckList').innerHTML = ev.check.map(function (c, i) { if (c.done) done++; return '<li><label class="' + (c.done ? 'on' : '') + '"><input type="checkbox"' + (c.done ? ' checked' : '') + ' onchange="toggleCheck(' + i + ',this.checked)">' + esc(c.t) + '</label></li>'; }).join('');
  document.getElementById('ckProg').textContent = done + '/' + ev.check.length + ' בוצעו';
  document.getElementById('ckBar').style.width = (ev.check.length ? Math.round(done / ev.check.length * 100) : 0) + '%';
}
function toggleCheck(i, on) { CUR.check[i].done = on; markOV(CUR); drawChecks(); renderKPIs(); DemoShell.toast('נשמר בדמו'); }
function setStatus(v) { CUR.status = v; markOV(CUR); var s = document.getElementById('dStat'); s.className = 'status ' + STAT[v][1]; s.textContent = STAT[v][0]; renderAll(); DemoShell.toast('הסטטוס עודכן: ' + STAT[v][0]); }

/* ─── הוספת אירוע ─── */
(function () {
  var body = '<div class="form-grid">'
    + '<label class="f span2">כותרת<input class="in" id="aTitle" placeholder="למשל: ערב הורים שכבת ח׳"></label>'
    + '<label class="f">תאריך התחלה<input class="in" type="date" id="aStart" min="2026-09-01" max="2027-06-30" value="' + dk(TODAY) + '"></label>'
    + '<label class="f">תאריך סיום (לא חובה)<input class="in" type="date" id="aEnd" min="2026-09-01" max="2027-06-30"></label>'
    + '<label class="f">סוג<select class="in" id="aType">' + Object.keys(TYPES).map(function (k) { return '<option value="' + k + '">' + TYPES[k].n + '</option>'; }).join('') + '</select></label>'
    + '<label class="f">אחראי/ת<select class="in" id="aRole">' + ROLES.map(function (r) { return '<option value="' + r.id + '">' + r.name + '</option>'; }).join('') + '</select></label>'
    + '<div class="span2"><div class="sec-t" style="margin:0 0 6px">שכבות (ריק = כל בית הספר)</div><div class="gchk">' + DEMO.grades.map(function (g) { return '<label><input type="checkbox" name="aGrade" value="' + g + '"> ' + g + '׳</label>'; }).join('') + '</div></div>'
    + '<label class="f">סטטוס<select class="in" id="aStat"><option value="plan">מתוכנן</option><option value="prep">בהכנה</option></select></label>'
    + '<label class="f">הערה<input class="in" id="aNotes" placeholder="מיקום, שעה…"></label>'
    + '<label class="f span2">צ\'קליסט הכנה (שורה לכל משימה)<textarea class="in" id="aCheck" placeholder="הזמנה להורים&#10;חדר ומקרן&#10;כיבוד"></textarea></label>'
    + '</div>';
  document.getElementById('addHost').innerHTML = DemoShell.modalHTML('mAdd', 'הוספת אירוע ללוח', body,
    '<button type="button" class="btn-sm" onclick="DemoShell.closeModal(\'mAdd\')">ביטול</button><button type="button" class="btn-sm primary" onclick="saveAdd()">הוספה ללוח</button>');
})();
function openAdd() { DemoShell.openModal('mAdd'); setTimeout(function () { document.getElementById('aTitle').focus(); }, 250); }
function saveAdd() {
  var title = document.getElementById('aTitle').value.trim(), start = document.getElementById('aStart').value, end = document.getElementById('aEnd').value;
  if (!title || !start) { DemoShell.toast('צריך כותרת ותאריך התחלה'); return; }
  if (!end || end < start) end = start;
  var grades = []; var cbs = document.querySelectorAll('input[name=aGrade]:checked'); for (var i = 0; i < cbs.length; i++) grades.push(cbs[i].value);
  var check = document.getElementById('aCheck').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).map(function (s) { return { t: s, done: false }; });
  var ev = { id: 'c' + Date.now(), title: title, start: start, end: end, type: document.getElementById('aType').value, role: document.getElementById('aRole').value, grades: grades, status: document.getElementById('aStat').value, check: check, notes: document.getElementById('aNotes').value.trim() };
  CUSTOM.push(ev); EVENTS.push(ev); persist();
  DemoShell.closeModal('mAdd');
  document.getElementById('aTitle').value = ''; document.getElementById('aCheck').value = ''; document.getElementById('aNotes').value = '';
  F.month = monthIdx(pd(start)); renderAll();
  DemoShell.toast('האירוע נוסף ללוח (נשמר בדמו)');
}
