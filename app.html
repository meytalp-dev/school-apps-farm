<body>

      </svg>
      <span>חוות האפליקציות</span>

    חזרה לחנות

<footer class="site">
  חוות האפליקציות — כלים דיגיטליים לניהול בית ספר ·
  <a target="_blank" rel="noopener" href="https://api.whatsapp.com/send?phone=972526857000&text=%D7%A9%D7%9C%D7%95%D7%9D%21%20%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%A9%D7%9E%D7%95%D7%A2%20%D7%A2%D7%95%D7%93%20%D7%A2%D7%9C%20%D7%97%D7%95%D7%95%D7%AA%20%D7%94%D7%90%D7%A4%D7%9C%D7%99%D7%A7%D7%A6%D7%99%D7%95%D7%AA">צרו קשר</a>

<div id="cart-root"></div>

<script src="apps-data.js"></script>
<!-- CRM שיווקי — קונפיג משותף -->
<script src="https://meytalp-dev.github.io/ort-presentation-builder/marketing/config.js"></script>
<script src="store.js"></script>
<script>
var SVG_FEAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';

function renderDetail() {
  var params = new URLSearchParams(location.search);
  var app = getApp(params.get('id'));
  var box = document.getElementById('detail');

  if (!app) {
    box.innerHTML = '<div class="detail-card"><h1>הכלי לא נמצא</h1>'
      + '<p class="detail-desc">אולי הקישור השתנה. <a href="index.html">חזרו לחנות</a> ובחרו מהקטלוג.</p></div>';
    return;
  }

  var c = getCategory(app.cat);
  document.title = app.name + ' — חוות האפליקציות';

  var feats = '';
  for (var i = 0; i < app.features.length; i++) {
    feats += '<li><span style="color:' + c.color + '">' + SVG_FEAT + '</span>' + app.features[i] + '</li>';
  }

  box.innerHTML = '<article class="detail-card">'
    + '<div class="detail-head">'
    +   '<div class="icon-tile" style="' + tileStyle(c.color) + '">' + iconSVG(app, c.color) + '</div>'
    +   '<div><h1>' + app.name + '</h1>'
    +   '<span class="cat-tag" style="background:' + c.color + '">' + c.name + '</span></div>'
    + '</div>'
    + '<p class="detail-desc">' + app.desc + '</p>'
    + '<h2 style="font-size:1.15rem;margin-top:20px">מה הכלי נותן</h2>'
    + '<ul class="features">' + feats + '</ul>'
    + '<div class="detail-actions">' + addBtnHTML(app.id) + '</div>'
    + '</article>';
}

renderDetail();
</script>
</body>
</html>
