<!DOCTYPE html>
<html dir="rtl" lang="he"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חוות האפליקציות — גיליון לוגואים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:Heebo,sans-serif;background:#F8FAFC;color:#061E4F;margin:0;padding:40px 24px}
h1{font-weight:900;letter-spacing:-1px;margin:0 0 6px}p{color:#64748B;margin:0 0 30px}
h2{font-size:14px;letter-spacing:2px;color:#12C7C7;margin:34px 0 14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.t{background:#fff;border-radius:22px;padding:22px 12px;text-align:center;box-shadow:0 2px 16px rgba(6,30,79,.06)}
.t svg{border-radius:26px;box-shadow:0 14px 30px rgba(6,30,79,.18)}.t b{display:block;margin-top:12px;font-size:14px}
</style></head><body>
<h1>גיליון לוגואים</h1><p>לוגו ייחודי לכל מערכת — לביקורת. מקור: logos.js</p>
<div id="s"></div>
<script src="apps-data.js"></script><script src="logos.js"></script>
<script>
var h='';for(var i=0;i<CATEGORIES.length;i++){var c=CATEGORIES[i];h+='<h2>'+c.name+'</h2><div class="g">';
for(var j=0;j<APPS.length;j++){if(APPS[j].cat!==c.id)continue;h+='<div class="t">'+logoSVG(APPS[j],96)+'<b>'+APPS[j].name+'</b></div>';}h+='</div>';}
document.getElementById('s').innerHTML=h;
</script></body></html>
